function fechaDHL(){

 const meses=[
  "ENE","FEB","MAR","ABR",
  "MAY","JUN","JUL","AGO",
  "SEP","OCT","NOV","DIC"
 ];

 const hoy=new Date();

 const dia=
 String(hoy.getDate())
 .padStart(2,"0");

 const mes=
 meses[hoy.getMonth()];

 const anio=
 String(hoy.getFullYear())
 .slice(-2);

 return `${dia} ${mes} ${anio}`;
}

function previewImage(
 event,
 imageId
){

 const archivo =
 event.target.files[0];

 if(!archivo){
  return;
 }

 const reader =
 new FileReader();

 reader.onload =
 function(e){

  const imagen =
  document.getElementById(
   imageId
  );

  imagen.src =
  e.target.result;

  imagen.style.display =
  "block";
  imagen.previousElementSibling.style.display="none";

  const boton =
document.getElementById(
`btn-${imageId}`
);

if(boton){

 boton.style.display =
 "block";

}

 };

 reader.readAsDataURL(
  archivo
 );

}

function validarEmbarques(){

 const tarjetas =
 document.querySelectorAll(
 "[id^='embarque-']"

 tarjetas.forEach(

 const inputs =

 const selects =
 tarjeta.querySelectorAll(
 "select"

const cortina =

const fotoInicio =

"input[type='file']"

const fotos =
tarjeta.querySelectorAll(
"input[type='file']"
);

const fotoMedio =
fotos[1];

const fotoFin =
fotos[2];

 if(!cortina){

  errores.push(
   `Embarque ${
   index+1
   }:
   Falta capturar cortina`
  );

 }

 else if(
  cortina.length > 3
 ){

  errores.push(
   `Embarque ${
   index+1
   }:
   Cortina inválida`
  );

 }

 if(!unidad){

  errores.push(
   `Embarque ${
   index+1
   }:
   Falta unidad de envío`
  );

 }

 else if(

 unidad.length < 8 ||

 unidad.length > 10

 ){

  errores.push(
   `Embarque ${
   index+1
   }:
   Unidad inválida`
  );

 }

 if(!destino){

   errores.push(
   `Embarque ${
   index+1
   }:
   Falta seleccionar destino`
   );

 }

 if(
 !fotoInicio.files ||
 fotoInicio.files.length === 0
){

 errores.push(
 `Embarque ${
 index+1
 }:
 Falta fotografía inicio`
 );

}

if(
 !fotoMedio.files ||
 fotoMedio.files.length === 0
){

 errores.push(
 `Embarque ${
 index+1
 }:
 Falta fotografía medio`
 );

}

if(
 !fotoFin.files ||
 fotoFin.files.length === 0
){

 errores.push(
 `Embarque ${
 index+1
 }:
 Falta fotografía fin`
 );

}

 });

async function comprimirImagen(file){

 return new Promise((resolve)=>{

   const img = new Image();

   const lector = new FileReader();

   lector.onload = function(e){

      img.src = e.target.result;

   };

   img.onload = function(){

      const canvas =
      document.createElement("canvas");

      let width = img.width;
      let height = img.height;

      const MAX_WIDTH = 1280;

      if(width > MAX_WIDTH){

         height =
         height * (MAX_WIDTH / width);

         width =
         MAX_WIDTH;

      }

      canvas.width = width;
      canvas.height = height;

      const ctx =
      canvas.getContext("2d");

      ctx.drawImage(
         img,
         0,
         0,
         width,
         height
      );

      canvas.toBlob(

        function(blob){

          resolve(blob);

        },

        "image/jpeg",

        0.70

      );

   };

   lector.readAsDataURL(file);

 });

}

 await supabaseClient.storage

 .upload(
   nombreArchivo,
   archivoComprimido
 );

   throw error;
 }

 const {
  data
 } =
 supabaseClient.storage
 .from("embarques-evidencia")

   nombreArchivo
 );

 return data.publicUrl;

}

function urlToBase64(url){

return new Promise((resolve,reject)=>{

const img = new Image();

img.crossOrigin = "anonymous";

img.onload = function(){

const canvas =
document.createElement("canvas");

canvas.width =
img.width;

canvas.height =
img.height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0
);

resolve(
canvas.toDataURL("image/jpeg")
);

};

img.onerror = reject;

img.src = url;

});

}

);
