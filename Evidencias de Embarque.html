<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Embarques</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6f8;
}

.header{
    background:#ffcc00;
    border-bottom:4px solid #d40511;
    padding:20px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-blue{
    background:#003b75;
    color:white;
}

.btn-red{
    background:#d40511;
    color:white;
}

.hidden{
    display:none;
}

.bottomBar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    padding:10px;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
    display:flex;
    gap:10px;
    z-index:999;
}

.bottomBar button{
    flex:1;
    margin:0;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

#contadorEmbarques{
    color:#003b75;
    text-align:center;
    margin-top:10px;
}

</style>

</head>

<body>

<div id="loginScreen">

    <div class="header">
        <h1>CONTROL DE EMBARQUES DHL</h1>
    </div>

    <div class="container">

        <div class="card">

            <button
                class="btn-blue"
                onclick="login('CUADRILLA A')">
                CUADRILLA A
            </button>

            <button
                class="btn-blue"
                onclick="login('CUADRILLA B')">
                CUADRILLA B
            </button>

            <button
                class="btn-blue"
                onclick="login('CUADRILLA C')">
                CUADRILLA C
            </button>

            <button
                class="btn-blue"
                onclick="login('CUADRILLA D')">
                CUADRILLA D
            </button>

            <button
                class="btn-red"
                onclick="login('ADMIN')">
                ADMIN
            </button>

        </div>

    </div>

</div>

<div
id="operadorScreen"
class="hidden">

    <div class="header">

    <h1 id="operadorTitulo"></h1>

    <button
    class="btn-blue"
    onclick="homeOperador()">
    HOME
</button>

<button
    class="btn-red"
    onclick="cerrarSesion()">
    CERRAR SESIÓN
</button>

</div>

    <div class="container">

        <div class="card">

    <h2>PANEL OPERADOR</h2>

<p
id="cuadrillaActualTexto"
style="
text-align:center;
color:#666;
margin-top:5px;
">
</p>

<h3 id="contadorEmbarques">
0 EMBARQUES
</h3>

<hr>

    <button
        class="btn-blue"
        onclick="nuevoEmbarque()">
        + NUEVO EMBARQUE
    </button>

</div>

<div
    id="listaEmbarques">
</div>

<div class="card">

    <h3 id="embarquesCompletos">
        COMPLETOS: 0
    </h3>

    <h3 id="embarquesIncompletos">
        INCOMPLETOS: 0
    </h3>

<button
class="btn-blue"
onclick="probarSupabase()">

PROBAR SUPABASE

</button>

    <button
        class="btn-blue"
        onclick="verSesion()">
        VER DATOS SESIÓN
    </button>

    <button
        class="btn-red"
        onclick="finalizarTurno()">
        FINALIZAR TURNO
    </button>

</div>

    </div>

<div
class="bottomBar"
id="bottomBar">

    <button
        class="btn-blue"
        onclick="nuevoEmbarque()">
        +
    </button>

    <button
        class="btn-blue"
        onclick="verSesion()">
        DATOS
    </button>

    <button
        class="btn-red"
        onclick="finalizarTurno()">
        FIN
    </button>

</div>

</div>

<div
id="adminScreen"
class="hidden">

    <div class="header">
        <h1>ADMINISTRACIÓN</h1>
    </div>

    <div class="container">

        <div class="card">

            <h2>ADMINISTRACIÓN</h2>
    <h3 id="totalHistoricos">

TOTAL TURNOS: 0

</h3>

<label>
Buscar por Unidad
</label>

<input
id="buscarUnidad"
placeholder="Unidad">

<button
class="btn-blue"
onclick="buscarUnidad()">

BUSCAR UNIDAD

</button>

<hr>

<label>
Buscar por Fecha
</label>

<input
id="buscarFecha"
type="date">

<button
class="btn-blue"
onclick="buscarFecha()">

BUSCAR FECHA

</button>

<hr>

<button
class="btn-blue"
onclick="verHistorial()">

VER HISTORIAL

</button>

<br><br>

<div id="resultadoAdmin">

Sin resultados

</div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://wpitemofrqzjcsetmmim.supabase.co';

const SUPABASE_KEY =
'sb_publishable_lHlAJ8Q2lThBAd9oDy69cw_QkSTlJLu';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let embarquesSesion =
JSON.parse(
    localStorage.getItem(
        "embarquesSesion"
    )
) || [];
let destinos = [];
let turnoSeleccionado = null;

let cuadrillaActual =
localStorage.getItem(
    "cuadrillaActual"
) || '';

async function cargarDestinos(){

    destinos = [

        "CHEDRAUI",
        "WALMART",
        "SORIANA",
        "COSTCO",
        "SAMS"

    ];

    renderEmbarques();

}

function nuevoEmbarque(){

    let numero = embarquesSesion.length + 1;

    embarquesSesion.push({

    numero: numero,

    fecha:
new Date()
.toLocaleDateString(
    'es-MX',
    {
        day:'2-digit',
        month:'short',
        year:'2-digit'
    }
)
.toUpperCase(),

hora:
new Date()
.toLocaleTimeString(
    'es-MX',
    {
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
    }
),

    cortina:'',
    unidad:'',
    destino:'',

fotoInicio:'',
fotoInicioPreview:'',

fotoMedio:'',
fotoMedioPreview:'',

fotoFin:'',
fotoFinPreview:'',

pdf:'',

guardado:false

});

    localStorage.setItem(
    "embarquesSesion",
    JSON.stringify(
        embarquesSesion
    )
);

renderEmbarques();

}

function renderEmbarques(){

    const contenedor =
    document.getElementById(
        "listaEmbarques"
    );

    contenedor.innerHTML = "";
    let completos = 0;

let incompletos = 0;

embarquesSesion.forEach(e=>{

    const completo =

        e.cortina &&
        e.unidad &&
        e.destino &&
        e.fotoInicioPreview &&
        e.fotoMedioPreview &&
        e.fotoFinPreview;

    if(completo){

        completos++;

    }
    else{

        incompletos++;

    }

});

document.getElementById(
    "embarquesCompletos"
).innerText =
"COMPLETOS: " +
completos;

document.getElementById(
    "embarquesIncompletos"
).innerText =
"INCOMPLETOS: " +
incompletos;
    document.getElementById(
    "contadorEmbarques"
).innerText =
embarquesSesion.length +
" EMBARQUES";
    localStorage.setItem(
    "embarquesSesion",
    JSON.stringify(
        embarquesSesion
    )
);

    embarquesSesion.forEach(e => {

        contenedor.innerHTML += `
<div class="card">

<h3 style="
color:#003b75;
text-align:center;
margin-bottom:10px;
">
    EMBARQUE #${e.numero}
</h3>

<div style="
text-align:center;
font-weight:bold;
margin-bottom:10px;
color:${
(
e.cortina &&
e.unidad &&
e.destino &&
e.fotoInicioPreview &&
e.fotoMedioPreview &&
e.fotoFinPreview
)
?
'green'
:
'red'
};
">

${
(
e.cortina &&
e.unidad &&
e.destino &&
e.fotoInicioPreview &&
e.fotoMedioPreview &&
e.fotoFinPreview
)
?
'🟢 COMPLETO'
:
'🔴 INCOMPLETO'
}

</div>

<div style="
font-size:12px;
margin-bottom:15px;
color:#666;
">

${!e.cortina ? '• Falta Cortina<br>' : ''}
${!e.unidad ? '• Falta Unidad<br>' : ''}
${!e.destino ? '• Falta Destino<br>' : ''}
${!e.fotoInicioPreview ? '• Falta Foto Inicio<br>' : ''}
${!e.fotoMedioPreview ? '• Falta Foto Medio<br>' : ''}
${!e.fotoFinPreview ? '• Falta Foto Fin<br>' : ''}

</div>

    <label>Fecha</label>

<input
    type="text"
    value="${e.fecha}"
    readonly>

<label>Hora de Captura</label>

<input
    type="text"
    value="${e.hora}"
    readonly>

    <label>Cortina</label>

<input
    type="text"
    maxlength="3"
    placeholder="Cortina"
    value="${e.cortina}"
    oninput="
        this.value=this.value.replace(/\D/g,'').slice(0,3);
        embarquesSesion[${e.numero-1}].cortina=this.value;

localStorage.setItem(
    'embarquesSesion',
    JSON.stringify(
        embarquesSesion
    )
);
    ">

    <label>Unidad de Embarque</label>

<input
    type="text"
    maxlength="10"
    placeholder="Unidad"
    value="${e.unidad}"
    oninput="
        this.value=this.value.replace(/\D/g,'').slice(0,10);
        embarquesSesion[${e.numero-1}].unidad=this.value;

localStorage.setItem(
    'embarquesSesion',
    JSON.stringify(
        embarquesSesion
    )
);

    ">

    <label>Destino</label>
    <label>
Destino de Entrega
</label>

<select
    id="destino_${e.numero}"
    onchange="
        embarquesSesion[${e.numero-1}].destino=this.value;

        localStorage.setItem(
            'embarquesSesion',
            JSON.stringify(
                embarquesSesion
            )
        );
    ">

    <option value="">
        Seleccione
    </option>

    ${destinos.map(d => `
        <option
            value="${d}"
            ${e.destino===d ? 'selected' : ''}>
            ${d}
        </option>
    `).join('')}

</select>

<br>

<label>Foto Inicio</label>

<input
    type="file"
    accept="image/*"
    capture="environment"
    onchange="previewFoto(event,${e.numero-1},'fotoInicio')">

${e.fotoInicioPreview ?
`
${e.fotoInicioPreview}
`
:
''
}


<br>

<label>Foto Medio</label>

<input
    type="file"
    accept="image/*"
    capture="environment"
    onchange="previewFoto(event,${e.numero-1},'fotoMedio')">

${e.fotoMedioPreview ?
`
${e.fotoMedioPreview}
`
:
''
}

<br>

<label>Foto Fin</label>

<input
    type="file"
    accept="image/*"
    capture="environment"
    onchange="previewFoto(event,${e.numero-1},'fotoFin')">

${e.fotoFinPreview ?
`
${e.fotoFinPreview}
`
:
''
}
<br>

<button
class="btn-blue"
onclick="duplicarEmbarque(${e.numero})">

DUPLICAR EMBARQUE

</button>

<button
class="btn-blue"
onclick="copiarDestino(${e.numero})">

COPIAR DESTINO

</button>

<button
class="btn-red"
onclick="eliminarEmbarque(${e.numero})">

ELIMINAR EMBARQUE

</button>

</button>

</div>
`;

    });

}

function previewFoto(
    event,
    index,
    campo
){

    const file =
    event.target.files[0];

    if(!file){
        return;
    }

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        embarquesSesion[index][campo] =
        file.name;

        embarquesSesion[index][campo+'Preview'] =
        e.target.result;

        localStorage.setItem(
            "embarquesSesion",
            JSON.stringify(
                embarquesSesion
            )
        );

        renderEmbarques();

    };

    reader.readAsDataURL(
        file
    );

}

function copiarDestino(numero){

    const original =
    embarquesSesion.find(
        e => e.numero === numero
    );

    if(!original){
        return;
    }

    embarquesSesion.push({

        numero:
        embarquesSesion.length + 1,

        fecha:
        new Date()
        .toLocaleDateString(
            'es-MX',
            {
                day:'2-digit',
                month:'short',
                year:'2-digit'
            }
        )
        .toUpperCase(),

        hora:
        new Date()
        .toLocaleTimeString(
            'es-MX',
            {
                hour:'2-digit',
                minute:'2-digit',
                hour12:false
            }
        ),

        cortina:'',

        unidad:'',

        destino:
        original.destino,

        fotoInicio:'',
        fotoInicioPreview:'',

        fotoMedio:'',
        fotoMedioPreview:'',

        fotoFin:'',
        fotoFinPreview:'',

        pdf:'',

        guardado:false

    });

    localStorage.setItem(
        "embarquesSesion",
        JSON.stringify(
            embarquesSesion
        )
    );

    renderEmbarques();

}

function duplicarEmbarque(numero){

    const original =
    embarquesSesion.find(
        e => e.numero === numero
    );

    if(!original){
        return;
    }

    const nuevo = {

        ...original,

        numero:
        embarquesSesion.length + 1,

        fotoInicio:'',
        fotoInicioPreview:'',

        fotoMedio:'',
        fotoMedioPreview:'',

        fotoFin:'',
        fotoFinPreview:'',

        guardado:false

    };

    embarquesSesion.push(
        nuevo
    );

    localStorage.setItem(
        "embarquesSesion",
        JSON.stringify(
            embarquesSesion
        )
    );

    renderEmbarques();

}

function eliminarEmbarque(numero){

    if(
        !confirm(
            "¿Eliminar embarque?"
        )
    ){
        return;
    }

    embarquesSesion =
    embarquesSesion.filter(
        e => e.numero !== numero
    );

    embarquesSesion.forEach(
        (e,index)=>{
            e.numero =
            index + 1;
        }
    );

    localStorage.setItem(
        "embarquesSesion",
        JSON.stringify(
            embarquesSesion
        )
    );

    renderEmbarques();

    console.log(
    embarquesSesion
);

}

async function probarSupabase(){

    try{

        const { data, error } =

        await supabase
        .from('destinos')
        .select('*')
        .limit(1);

        if(error){

            console.error(error);

            alert(
                'Error Supabase'
            );

            return;

        }

        console.log(data);

        alert(
            'Supabase conectado'
        );

    }
    catch(err){

        console.error(err);

        alert(
            'Error conexión'
        );

    }

}

function verSesion(){

    console.clear();

    console.log(
        "CUADRILLA:",
        cuadrillaActual
    );

    console.log(
        construirDatosPDF()
    );

    alert(
        "Sesión enviada a consola F12"
    );

}

function construirDatosPDF(){

    return embarquesSesion.map(e => {

        return {

            embarque: e.numero,

            fecha: e.fecha,
            hora: e.hora,

            cuadrilla: cuadrillaActual,

            cortina: e.cortina,

            unidad: e.unidad,

            destino: e.destino,

            fotoInicio: e.fotoInicioPreview,

            fotoMedio: e.fotoMedioPreview,

            fotoFin: e.fotoFinPreview

        };

    });

}

function finalizarTurno(){

    if(
        embarquesSesion.length === 0
    ){
        alert(
            "No hay embarques capturados"
        );
        return;
    }

    let incompletos =
embarquesSesion.some(e =>

    !e.cortina ||
    !e.unidad ||
    !e.destino ||
    !e.fotoInicioPreview ||
    !e.fotoMedioPreview ||
    !e.fotoFinPreview

);

    if(incompletos){

        alert(
    "Faltan datos o fotografías obligatorias"
);

        return;
    }

    const datosPDF =
construirDatosPDF();
let historial =

JSON.parse(
localStorage.getItem(
"historialEmbarques"
)
) || [];

historial.push({

fechaGuardado:
new Date()
.toISOString(),

cuadrilla:
cuadrillaActual,

totalEmbarques:
datosPDF.length,

embarques:
datosPDF

});

localStorage.setItem(

"historialEmbarques",

JSON.stringify(
historial
)

);

console.log(
    "PDF",
    datosPDF
);

console.table(
    datosPDF
);

alert(
embarquesSesion.length +
" embarques listos para PDF"
);

console.log(
    construirDatosPDF()
);

}

function verDetalleTurno(index){

    const historial =

    JSON.parse(
    localStorage.getItem(
        "historialEmbarques"
    )
    ) || [];

    const turno =
    historial[index];
    turnoSeleccionado = turno;

    if(!turno){
        return;
    }

    document
    .getElementById(
        "resultadoAdmin"
    )
    .innerHTML =

    "<pre>" +

    JSON.stringify(
        turno,
        null,
        2
    )

    +

    "</pre>";

}

function eliminarTurno(index){

    if(
        !confirm(
            "¿Eliminar turno?"
        )
    ){
        return;
    }

    let historial =

    JSON.parse(
    localStorage.getItem(
        "historialEmbarques"
    )
    ) || [];

    historial.splice(
        index,
        1
    );

    localStorage.setItem(
        "historialEmbarques",
        JSON.stringify(
            historial
        )
    );

    verHistorial();

}

function verHistorial(){

    const historial =

    JSON.parse(
    localStorage.getItem(
        "historialEmbarques"
    )
    ) || [];

    document
.getElementById(
    "totalHistoricos"
)
.innerText =

"TOTAL TURNOS: " +

historial.length;

    let html = "";

historial.forEach((h,index)=>{

    html += `

<div class="card">

    <b>Turno:</b>
    ${index+1}

    <br>

    <b>Cuadrilla:</b>
    ${h.cuadrilla}

    <br>

    <b>Embarques:</b>
    ${h.totalEmbarques}

    <br>

    <b>Fecha:</b>
    ${h.fechaGuardado}

    <br><br>

    <button
    class="btn-blue"
    onclick="verDetalleTurno(${index})">

    VER DETALLE

    </button>

    <button
class="btn-red"
onclick="eliminarTurno(${index})">

ELIMINAR TURNO

</button>

</div>

`;

});

document
.getElementById(
    "resultadoAdmin"
)
.innerHTML =
html;

    "</pre>";

}

function buscarUnidad(){

    const unidad =

    document
    .getElementById(
        "buscarUnidad"
    )
    .value
    .trim();

    const historial =

    JSON.parse(
    localStorage.getItem(
        "historialEmbarques"
    )
    ) || [];

    let resultados = [];

    historial.forEach(g=>{

        g.embarques.forEach(e=>{

            if(
                e.unidad === unidad
            ){
                resultados.push(e);
            }

        });

    });

    document
    .getElementById(
        "resultadoAdmin"
    )
    .innerHTML =

    "<pre>" +

    JSON.stringify(
        resultados,
        null,
        2
    )

    +

    "</pre>";

}

function buscarFecha(){

    const historial =

    JSON.parse(
    localStorage.getItem(
        "historialEmbarques"
    )
    ) || [];

    document
    .getElementById(
        "resultadoAdmin"
    )
    .innerHTML =

    "<pre>" +

    JSON.stringify(
        historial,
        null,
        2
    )

    +

    "</pre>";

}

function login(usuario){
    document.getElementById(
    "bottomBar"
).style.display="none";

    document
        .getElementById("loginScreen")
        .classList
        .add("hidden");

    if(usuario==="ADMIN"){
        const historial =

JSON.parse(
localStorage.getItem(
    "historialEmbarques"
)
) || [];

document
.getElementById(
    "totalHistoricos"
)
.innerText =

"TOTAL TURNOS: " +

historial.length;

        document
            .getElementById("adminScreen")
            .classList
            .remove("hidden");

    }
    else{

        document
            .getElementById("operadorScreen")
            .classList
            .remove("hidden");
            document.getElementById(
    "bottomBar"
).style.display="flex";

document
.getElementById(
    "cuadrillaActualTexto"
)
.innerText =
usuario;

cuadrillaActual = usuario;
localStorage.setItem(
    "cuadrillaActual",
    usuario
);

cargarDestinos();

    }

}

function homeOperador(){

    renderEmbarques();

}

function cerrarSesion(){
    document.getElementById(
    "bottomBar"
).style.display="none";

    localStorage.removeItem(
        "cuadrillaActual"
    );

    document
        .getElementById(
            "operadorScreen"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "adminScreen"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "loginScreen"
        )
        .classList
        .remove("hidden");

}

if(
    cuadrillaActual &&
    cuadrillaActual !== ''
){

    login(
        cuadrillaActual
    );

}

</script>

</body>
</html>
